# ==========================================================
# SPRING BOOT APPLICATION CONFIGURATION
# Pet Care & Services Marketplace
# ==========================================================

server.port=8080

# Spring Application Name
spring.application.name=pet-care-marketplace

# Database Configuration (Environment variable fallback with default local root/root)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_care_marketplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d2e4a7b9c1d3f5a7e9b2c4d6f8a1c3e5b7d9f2a4c6e8}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External AI API Configuration (Supports Gemini / OpenAI, or Demo Mode Fallback)
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
app.ai.enabled=${AI_ENABLED:false}

# Logging
logging.level.com.petcare.marketplace=INFO
logging.level.org.springframework.security=WARN
